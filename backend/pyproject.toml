[project]
name = "contract-guardian-ai-backend"
version = "2.0.0"
description = "Enterprise-grade AI Contract Risk Analyzer backend - CO1-CO6"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "gunicorn>=22.0.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "email-validator>=2.2.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "PyMuPDF>=1.24.0",
  "python-docx>=1.1.0",
  "langchain>=0.2.0",
  "langchain-openai>=0.1.0",
  "openai>=1.35.0",
  "reportlab>=4.2.0",
  "markdown>=3.6",
  "orjson>=3.10.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  # CO2: MongoDB
  "motor>=3.4.0",
  "pymongo>=4.7.0",
  # CO6: Observability
  "prometheus-client>=0.20.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.10",
  "pdf2image>=1.17.0",
  "pillow>=10.3.0",
]
otel = [
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]
vector = [
  "pgvector>=0.3.0",
  "pinecone-client>=3.0.0",
  "weaviate-client>=4.0.0",
]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
]
all = [
  "motor>=3.4.0",
  "pymongo>=4.7.0",
  "prometheus-client>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
