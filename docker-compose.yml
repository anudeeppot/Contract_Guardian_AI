version: '3.9'

# =============================================================
# CONTRACT GUARDIAN AI - Docker Compose
# CO6: Multi-service integration, Networks, Health checks
# =============================================================

networks:
  contract-guardian-net:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  app_data:
  prometheus_data:
  grafana_data:

services:

  # ============================================================
  # POSTGRESQL (CO1: Primary relational database)
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cg-postgres
    environment:
      POSTGRES_DB: contract_guardian
      POSTGRES_USER: contract_guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contract_guardian}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - contract-guardian-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_guardian -d contract_guardian"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ============================================================
  # MONGODB (CO2: Document database for polyglot persistence)
  # ============================================================
  mongodb:
    image: mongo:7-jammy
    container_name: cg-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cgadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cgpassword}
      MONGO_INITDB_DATABASE: contract_guardian
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - contract-guardian-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================================================
  # FASTAPI BACKEND (CO3: Main backend)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cg-backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://contract_guardian:${POSTGRES_PASSWORD:-contract_guardian}@postgres:5432/contract_guardian
      MONGODB_URL: mongodb://${MONGO_USER:-cgadmin}:${MONGO_PASSWORD:-cgpassword}@mongodb:27017/contract_guardian?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me-before-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:3000
      UPLOAD_DIR: /data/uploads
      REPORT_DIR: /data/reports
      X402_ENABLED: "false"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: http://otelcollector:4317
      PROMETHEUS_ENABLED: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - contract-guardian-net
    command: >
      sh -c "alembic upgrade head &&
      gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --workers 2 --timeout 180"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # NODE.JS ACTIVITY SERVICE (CO4, CO5)
  # ============================================================
  node-activity:
    build:
      context: ./services/node-activity
      dockerfile: Dockerfile
    container_name: cg-node-activity
    environment:
      PORT: 3001
      MONGODB_URL: mongodb://${MONGO_USER:-cgadmin}:${MONGO_PASSWORD:-cgpassword}@mongodb:27017/contract_guardian?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me-before-demo}
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - contract-guardian-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # FRONTEND (React/Vite)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: cg-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - contract-guardian-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # PROMETHEUS (CO6: Metrics collection)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: cg-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - contract-guardian-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # ============================================================
  # GRAFANA (CO6: Metrics visualization)
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: cg-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - contract-guardian-net
