global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI backend metrics
  - job_name: 'fastapi-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Node.js activity service (if it exposes /metrics)
  - job_name: 'node-activity'
    static_configs:
      - targets: ['node-activity:3001']
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL exporter (optional)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
