spring:
  application:
    name: contract-report-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/contract_guardian}
    username: ${DB_USER:contract_guardian}
    password: ${DB_PASSWORD:contract_guardian}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
  service:
    name: Contract Report Service
    version: 1.0.0
    description: CO4 Spring Boot microservice for contract reports
